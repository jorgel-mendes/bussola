name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres, not SQLite. The Sprint 2 budget accountant relies on
    # select_for_update(), which is a no-op on SQLite -- the concurrency tests
    # would pass vacuously and the privacy guarantee would be unverified.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bussola
          POSTGRES_PASSWORD: bussola
          POSTGRES_DB: bussola_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://bussola:bussola@localhost:5432/bussola_test
      # Turns a silent skip into a build failure. The concurrency tests skip on
      # SQLite by design (select_for_update() is a no-op there, so they would
      # pass while proving nothing). In CI that skip must never happen quietly:
      # a mistyped DATABASE_URL or a Postgres service that failed to start would
      # otherwise reduce the project's most important test to four skips and a
      # green tick. hub/test_postgres_guard.py fails the build instead.
      BUSSOLA_REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # OpenDP is a core dependency from Sprint 2 -- the release path imports
        # it -- so a plain `uv sync --dev` now installs it.
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check for missing migrations
        # Catches a model changed without makemigrations -- which would deploy
        # a schema that does not match the code.
        run: uv run python hub/manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Django system checks (production settings)
        run: uv run python hub/manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # Must be 50+ chars with 5+ unique characters or security.W009 fails
          # the build. Not a real secret — the real one is generated by Render.
          SECRET_KEY: ci-placeholder-only-nGq7Xv2mPz4WkLb9RtYuHcEaSdFgJhKlMnBvCxZq
          ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build hub image
        run: docker build -f deploy/Dockerfile.hub -t bussola-hub:ci .
      - name: Build agent image
        run: docker build -f deploy/Dockerfile.agent -t bussola-agent:ci .
