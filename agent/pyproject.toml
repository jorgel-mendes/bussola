[project]
name = "bussola-agent"
version = "0.1.0"
description = "Bussola plant-side agent: computes local aggregates and submits them to the hub"
requires-python = ">=3.12"
dependencies = [
    "bussola-contracts",
    "httpx>=0.27",
    "polars>=1.0",
    "typer>=0.15",
]

[project.scripts]
bussola-agent = "bussola_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bussola_agent"]

[tool.uv.sources]
bussola-contracts = { workspace = true }
