[project]
name = "bussola-hub"
version = "0.1.0"
description = "Privacy-preserving industrial benchmarking platform — hub"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "polars>=1.36,<1.37",  # pinned: OpenDP 0.15.1 embeds Polars 1.36.1 DSL schema
    "opendp>=0.15,<0.16",  # core from Sprint 2: the hub cannot release without it
    "pyarrow>=17",         # required by OpenDP summarize(); OpenDP does not declare it
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "bussola-contracts",
]

[project.optional-dependencies]
# Retained so `uv sync --extra dp` keeps working for anyone following the
# Sprint 1 spike instructions. From Sprint 2 these are core dependencies: the
# hub's whole job is releasing differentially private statistics, and the
# Docker image builds with `--no-dev` and no extras, so an optional OpenDP
# would deploy a hub that cannot release.
dp = ["opendp>=0.15,<0.16", "pyarrow>=17"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "hypothesis>=6.100",
    "respx>=0.21",
    "bussola-agent",
]

[tool.uv.workspace]
members = ["contracts", "agent"]

[tool.uv.sources]
bussola-contracts = { workspace = true }
bussola-agent = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
# "." puts the repo root on the path so `evaluation` imports as a package.
pythonpath = ["hub", "."]
testpaths = ["hub", "agent", "tests", "evaluation"]
python_files = ["test_*.py"]
# The sweep grid is deselected by default. Its FAST tests -- the measurement
# functions the article's numbers come from -- are unmarked and run on every
# push; only the 35-cell grid is held back, in its own CI job (sweep.yml).
# Deselecting the slow tests rather than the whole directory is deliberate: a
# harness whose tests never run is a harness nobody trusts.
addopts = "-q --strict-markers -m 'not sweep'"
markers = [
    "sweep: the full privacy-utility grid. Minutes, not seconds. Run with `-m sweep`.",
]

[tool.coverage.run]
source = ["hub", "agent/bussola_agent", "contracts/bussola_contracts"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "hub/manage.py", "*/wsgi.py", "*/asgi.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"]

[tool.ruff.lint.isort]
# The Django apps live under hub/ and are imported by bare name, so ruff would
# otherwise sort them as third-party.
known-first-party = [
    "benchmarks",
    "budget",
    "bussola_agent",
    "bussola_contracts",
    "catalog",
    "collaborations",
    "config",
    "contributors",
    "evaluation",
    "ingest",
    "privacy",
]
