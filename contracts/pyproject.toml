[project]
name = "bussola-contracts"
version = "0.1.0"
description = "Wire contract shared by the Bussola agent and hub"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bussola_contracts"]
